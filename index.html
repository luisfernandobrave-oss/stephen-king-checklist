<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephen King – Reading Checklist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #e8dcc8;
      font-family: 'Georgia', serif;
    }

    /* HEADER */
    #header {
      text-align: center;
      padding: 48px 24px 32px;
      background: linear-gradient(180deg, #1a0a0a 0%, #0d0d0d 100%);
      border-bottom: 1px solid #2a1a1a;
      position: relative;
      overflow: hidden;
    }
    #header::before {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,0,0,0.03) 2px, rgba(139,0,0,0.03) 4px);
      pointer-events: none;
    }
    #lang-toggle {
      position: absolute; top: 20px; right: 20px;
      display: flex; border: 1px solid #2a2a2a; border-radius: 5px; overflow: hidden;
    }
    #lang-toggle button {
      background: #1a1a1a; border: none; color: #5a4a3a;
      padding: 6px 14px; cursor: pointer; font-size: 0.78rem;
      font-family: Georgia, serif; letter-spacing: 0.1em; text-transform: uppercase;
      transition: all 0.2s;
    }
    #lang-toggle button.active { background: #8b0000; color: #fff; }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-family: 'Palatino Linotype', 'Book Antiqua', serif;
      color: #e8dcc8; letter-spacing: 0.04em;
      text-shadow: 0 0 60px rgba(139,0,0,0.4); font-weight: normal;
      margin-bottom: 4px;
    }
    h2 {
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      font-family: 'Palatino Linotype', serif; color: #8b0000;
      margin-bottom: 32px; letter-spacing: 0.3em;
      text-transform: uppercase; font-weight: normal;
    }

    /* PROGRESS */
    #progress-wrap { max-width: 420px; margin: 0 auto 8px; }
    #progress-bar-bg {
      height: 6px; background: #1e1e1e; border-radius: 3px;
      overflow: hidden; border: 1px solid #2a2a2a;
    }
    #progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #8b0000, #c0392b);
      border-radius: 3px; transition: width 0.5s ease;
      box-shadow: 0 0 12px rgba(139,0,0,0.6);
    }
    #progress-text { margin-top: 8px; font-size: 0.85rem; color: #7a6a5a; letter-spacing: 0.1em; }

    #progress-wrap-owned { max-width: 420px; margin: 12px auto 0; }
    #progress-bar-bg-owned {
      height: 6px; background: #1e1e1e; border-radius: 3px;
      overflow: hidden; border: 1px solid #2a2a2a;
    }
    #progress-bar-owned {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #1a5c1a, #2a9a2a);
      border-radius: 3px; transition: width 0.5s ease;
      box-shadow: 0 0 12px rgba(42,154,42,0.5);
    }
    #progress-text-owned { margin-top: 8px; font-size: 0.85rem; color: #6a8a6a; letter-spacing: 0.1em; }

    /* CONTROLS */
    #controls {
      max-width: 1100px; margin: 0 auto;
      padding: 24px 20px 0;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    #search {
      flex: 1 1 200px;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 4px;
      color: #e8dcc8; padding: 8px 14px; font-size: 0.9rem;
      outline: none; font-family: Georgia, serif;
    }
    #filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      background: #1a1a1a; border: 1px solid #2a2a2a; color: #7a6a5a;
      border-radius: 4px; padding: 6px 14px; cursor: pointer;
      font-size: 0.8rem; letter-spacing: 0.05em;
      transition: all 0.2s; font-family: Georgia, serif;
    }
    .filter-btn.active { background: #8b0000; border-color: #8b0000; color: #fff; }
    #add-btn {
      background: #1a1a1a; border: 1px solid #8b0000; color: #e8dcc8;
      border-radius: 4px; padding: 6px 16px; cursor: pointer;
      font-size: 0.85rem; font-family: Georgia, serif; transition: all 0.2s;
    }
    #add-btn.open { background: #2a1a1a; }

    /* ADD FORM */
    #add-form {
      max-width: 1100px; margin: 16px auto 0; padding: 0 20px;
      display: none;
    }
    #add-form.visible { display: block; }
    #add-form-inner {
      background: #141414; border: 1px solid #2a1a1a; border-radius: 6px;
      padding: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    }
    .form-group { display: flex; flex-direction: column; }
    .form-group label {
      font-size: 0.75rem; color: #7a6a5a; margin-bottom: 6px;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .form-group input {
      background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 4px;
      color: #e8dcc8; padding: 8px 12px; font-size: 0.9rem;
      outline: none; font-family: Georgia, serif;
    }
    #tag-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-btn {
      background: #0d0d0d; border: 1px solid #2a2a2a; color: #5a4a3a;
      border-radius: 3px; padding: 4px 10px; cursor: pointer;
      font-size: 0.75rem; font-family: Georgia, serif; transition: all 0.2s;
    }
    .tag-btn.selected { background: #2a1010; border-color: #8b0000; color: #e8dcc8; }
    #submit-btn {
      background: #8b0000; border: none; color: #fff; border-radius: 4px;
      padding: 9px 20px; cursor: pointer; font-size: 0.9rem;
      font-family: Georgia, serif; white-space: nowrap;
    }

    /* BOOK GRID */
    #book-grid {
      max-width: 1100px; margin: 24px auto 60px; padding: 0 20px;
      columns: 3 280px; column-gap: 24px;
    }
    .book-item {
      break-inside: avoid; margin-bottom: 2px;
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 8px; border-radius: 3px;
      background: transparent; transition: background 0.2s;
      border-left: 2px solid transparent;
      user-select: none;
    }
    .book-item.read {
      background: rgba(139,0,0,0.06);
      border-left-color: #8b0000;
    }
    .book-item:hover { background: rgba(255,255,255,0.02); }
    .book-item.read:hover { background: rgba(139,0,0,0.09); }

    .checkbox {
      width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px;
      border: 1.5px solid #3a3a3a; border-radius: 2px;
      background: transparent; display: flex; align-items: center;
      justify-content: center; transition: all 0.2s; cursor: pointer;
    }
    .checkbox.read-cb.checked {
      background: #8b0000; border-color: #8b0000;
    }
    .checkbox.owned-cb.checked {
      background: #1a5c1a; border-color: #1a5c1a;
    }
    .checkbox svg { display: none; }
    .checkbox.checked svg { display: block; }

    .book-title {
      font-size: 0.85rem; color: #c8b898; line-height: 1.35;
      transition: color 0.2s;
    }
    .book-item.read .book-title {
      color: #5a4a3a;
      text-decoration: line-through;
      text-decoration-color: #5a3a2a;
    }
    .book-year { color: #4a3a2a; font-size: 0.75rem; }
    .book-number {
      color: #8b0000; font-weight: bold; font-size: 0.75rem;
      margin-right: 4px; letter-spacing: 0.05em;
    }
    .book-item.read .book-number { color: #5a3a2a; }
    .book-tag { margin-left: 3px; }
    .owned-badge {
      margin-left: 5px; font-size: 0.7rem; color: #2a9a2a;
    }
    .missing-badge {
      margin-left: 5px; font-size: 0.7rem; color: #b03030;
    }
    .remove-btn {
      margin-left: 6px; color: #5a2a2a; font-size: 0.7rem;
      cursor: pointer;
    }

    #empty-msg {
      color: #3a3a3a; text-align: center; padding: 40px 0;
      display: none; grid-column: 1/-1;
    }

    /* EXPORT / IMPORT */
    #backup-bar {
      max-width: 1100px; margin: 0 auto 0; padding: 0 20px 20px;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .backup-btn {
      display: flex; align-items: center; gap: 6px;
      border-radius: 4px; padding: 7px 16px; cursor: pointer;
      font-size: 0.82rem; font-family: Georgia, serif;
      transition: all 0.2s; letter-spacing: 0.03em;
    }
    #export-btn {
      background: #0d2a0d; border: 1px solid #1a5c1a; color: #7ecf7e;
    }
    #export-btn:hover { background: #142e14; border-color: #2a7a2a; }
    #import-label {
      background: #0d1a2a; border: 1px solid #1a3a5c; color: #7eb8cf;
      display: flex; align-items: center; gap: 6px;
      border-radius: 4px; padding: 7px 16px; cursor: pointer;
      font-size: 0.82rem; font-family: Georgia, serif;
      transition: all 0.2s;
    }
    #import-label:hover { background: #142230; border-color: #2a5a7a; }
    #import-input { display: none; }
    #backup-msg {
      font-size: 0.78rem; color: #5a7a5a; letter-spacing: 0.05em;
      opacity: 0; transition: opacity 0.4s;
    }
    #backup-msg.show { opacity: 1; }

    /* LEGEND */
    #legend {
      border-top: 1px solid #1a1a1a; padding: 20px;
      display: flex; justify-content: center;
      flex-wrap: wrap; gap: 16px 32px;
    }
    .legend-item { font-size: 0.75rem; color: #5a4a3a; letter-spacing: 0.05em; }

    /* INFO BOX */
    #info-box {
      max-width: 1100px; margin: 0 auto; padding: 0 20px 8px;
      font-size: 0.78rem; color: #6a5a4a; line-height: 1.5;
    }
    #info-box code {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 3px;
      padding: 1px 6px; color: #c8b898; font-family: monospace; font-size: 0.78rem;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="lang-toggle">
    <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
    <button id="btn-es" onclick="setLang('es')">ES</button>
  </div>
  <h1>Stephen King</h1>
  <h2 id="subtitle">Reading Checklist</h2>
  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    <p id="progress-text"></p>
  </div>
  <div id="progress-wrap-owned">
    <div id="progress-bar-bg-owned"><div id="progress-bar-owned"></div></div>
    <p id="progress-text-owned"></p>
  </div>
</div>

<!-- CONTROLS -->
<div id="controls">
  <input id="search" type="text" placeholder="Search book..." oninput="renderBooks()" />
  <div id="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
    <button class="filter-btn" data-filter="read" onclick="setFilter('read')">Read</button>
    <button class="filter-btn" data-filter="unread" onclick="setFilter('unread')">Unread</button>
    <button class="filter-btn" data-filter="owned" onclick="setFilter('owned')">Owned</button>
    <button class="filter-btn" data-filter="missing" onclick="setFilter('missing')">Missing</button>
    <button class="filter-btn" data-filter="collection" onclick="setFilter('collection')">Collection</button>
    <button class="filter-btn" data-filter="bachman" onclick="setFilter('bachman')">Bachman</button>
  </div>
  <button id="add-btn" onclick="toggleAddForm()">+ Add book</button>
</div>

<!-- BACKUP BAR -->
<div id="backup-bar">
  <button class="backup-btn" id="export-btn" onclick="exportProgress()">
    ⬇ <span id="lbl-export">Export progress</span>
  </button>
  <label id="import-label">
    ⬆ <span id="lbl-import">Import progress</span>
    <input type="file" id="import-input" accept=".json" onchange="importProgress(event)" />
  </label>
  <span id="backup-msg"></span>
</div>

<!-- ADD FORM -->
<div id="add-form">
  <div id="add-form-inner">
    <div class="form-group" style="flex: 2 1 170px">
      <label id="lbl-title-en">Title (English)</label>
      <input id="inp-title" placeholder="The Shining" />
    </div>
    <div class="form-group" style="flex: 2 1 170px">
      <label id="lbl-title-es">Title (Spanish)</label>
      <input id="inp-title-es" placeholder="El resplandor" />
    </div>
    <div class="form-group" style="flex: 0 1 90px">
      <label id="lbl-year">Year</label>
      <input id="inp-year" type="number" placeholder="2024" style="width:100%" />
    </div>
    <div class="form-group" style="flex: 1 1 260px">
      <label id="lbl-tags">Tags</label>
      <div id="tag-btns"></div>
    </div>
    <button id="submit-btn" onclick="addBook()">Add</button>
  </div>
</div>

<!-- INFO BOX: instructions to add books in code -->
<div id="info-box">
  <span id="info-text">
    Tip: you can also bulk-add books directly in the code. Open the script and add objects to the <code>INITIAL_BOOKS</code> array, e.g.
    <code>{ id: 1, title: "The Shining", titleEs: "El resplandor", year: 1977, tags: [] }</code>
  </span>
</div>

<!-- BOOK GRID -->
<div id="book-grid"></div>

<!-- LEGEND -->
<div id="legend"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
// Empty on purpose. Add your own books either via the "+ Add book" form,
// or by pasting objects into this array, e.g.:
// { id: 1, title: "The Shining", titleEs: "El resplandor", year: 1977, tags: [] },
const INITIAL_BOOKS = [

];

const TAGS = {
  bachman:    { label: "Richard Bachman", labelEs: "Richard Bachman", emoji: "🎭" },
  coauthored: { label: "Co-authored",     labelEs: "Co-escrito",      emoji: "👥" },
  collection: { label: "Collection",      labelEs: "Colección",       emoji: "📚" },
  nonfiction: { label: "Non-fiction",     labelEs: "No ficción",      emoji: "📖" },
  graphic:    { label: "Graphic Novel",   labelEs: "Novela gráfica",  emoji: "🎨" },
  series:     { label: "Series",          labelEs: "Serie",           emoji: "⛓️" },
  adapted:    { label: "Film/TV",         labelEs: "Película/TV",     emoji: "🎬" },
  horror:     { label: "Horror",          labelEs: "Terror",          emoji: "👻" },
};

const I18N = {
  en: {
    subtitle: "Reading Checklist", read: "read", owned: "owned", search: "Search book...",
    all: "All", readF: "Read", unread: "Unread", ownedF: "Owned", missingF: "Missing", collection: "Collection",
    addBtn: "+ Add book", addBtnOpen: "✕ Close",
    lblTitleEn: "Title (English)", lblTitleEs: "Title (Spanish)",
    lblYear: "Year", lblTags: "Tags", submit: "Add",
    empty: "No books found.",
    export: "Export progress", import: "Import progress",
    exportOk: "✓ Progress exported!", importOk: "✓ Progress imported!", importErr: "⚠ Invalid file.",
    info: 'Tip: you can also bulk-add books directly in the code. Open the script and add objects to the <code>INITIAL_BOOKS</code> array, e.g. <code>{ id: 1, title: "The Shining", titleEs: "El resplandor", year: 1977, tags: [] }</code>',
    ownedTitle: "Owned", missingTitle: "Need to buy",
  },
  es: {
    subtitle: "Lista de Lectura", read: "leídos", owned: "tengo", search: "Buscar libro...",
    all: "Todos", readF: "Leídos", unread: "Pendientes", ownedF: "Tengo", missingF: "Me falta", collection: "Colección",
    addBtn: "+ Agregar libro", addBtnOpen: "✕ Cerrar",
    lblTitleEn: "Título (inglés)", lblTitleEs: "Título (español)",
    lblYear: "Año", lblTags: "Etiquetas", submit: "Agregar",
    empty: "No se encontraron libros.",
    export: "Exportar progreso", import: "Importar progreso",
    exportOk: "✓ ¡Progreso exportado!", importOk: "✓ ¡Progreso importado!", importErr: "⚠ Archivo inválido.",
    info: 'Consejo: también puedes agregar libros en bloque directamente en el código. Abre el script y añade objetos al arreglo <code>INITIAL_BOOKS</code>, por ejemplo: <code>{ id: 1, title: "The Shining", titleEs: "El resplandor", year: 1977, tags: [] }</code>',
    ownedTitle: "Lo tengo", missingTitle: "Falta comprarlo",
  }
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let books  = JSON.parse(localStorage.getItem("sk_books_v3")  || "null") || INITIAL_BOOKS;
let read   = JSON.parse(localStorage.getItem("sk_read")      || "{}");
let owned  = JSON.parse(localStorage.getItem("sk_owned")     || "{}");
let lang   = localStorage.getItem("sk_lang") || "en";
let filter = "all";
let addFormOpen = false;
let selectedTags = [];

function save() {
  localStorage.setItem("sk_books_v3", JSON.stringify(books));
  localStorage.setItem("sk_read",      JSON.stringify(read));
  localStorage.setItem("sk_owned",     JSON.stringify(owned));
  localStorage.setItem("sk_lang",      lang);
}

// ── LANG ──────────────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  save();
  applyLang();
  renderBooks();
}

function applyLang() {
  const t = I18N[lang];
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("search").placeholder   = t.search;
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.getElementById("btn-es").classList.toggle("active", lang === "es");
  document.getElementById("add-btn").textContent  = addFormOpen ? t.addBtnOpen : t.addBtn;
  document.getElementById("lbl-title-en").textContent = t.lblTitleEn;
  document.getElementById("lbl-title-es").textContent = t.lblTitleEs;
  document.getElementById("lbl-year").textContent     = t.lblYear;
  document.getElementById("lbl-tags").textContent     = t.lblTags;
  document.getElementById("submit-btn").textContent   = t.submit;
  document.getElementById("lbl-export").textContent   = t.export;
  document.getElementById("lbl-import").textContent   = t.import;
  document.getElementById("info-text").innerHTML      = t.info;
  // filter buttons
  const fb = document.querySelectorAll(".filter-btn");
  const labels = [t.all, t.readF, t.unread, t.ownedF, t.missingF, t.collection, "Bachman"];
  fb.forEach((b, i) => b.textContent = labels[i]);
  renderTagButtons();
  renderLegend();
  updateProgress();
}

// ── FILTER ────────────────────────────────────────────────────────────────────
function setFilter(f) {
  filter = f;
  document.querySelectorAll(".filter-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.filter === f)
  );
  renderBooks();
}

// ── ADD FORM ──────────────────────────────────────────────────────────────────
function toggleAddForm() {
  addFormOpen = !addFormOpen;
  document.getElementById("add-form").classList.toggle("visible", addFormOpen);
  document.getElementById("add-btn").textContent = addFormOpen ? I18N[lang].addBtnOpen : I18N[lang].addBtn;
  document.getElementById("add-btn").classList.toggle("open", addFormOpen);
}

function renderTagButtons() {
  const wrap = document.getElementById("tag-btns");
  wrap.innerHTML = "";
  Object.entries(TAGS).forEach(([key, cfg]) => {
    const b = document.createElement("button");
    b.className = "tag-btn" + (selectedTags.includes(key) ? " selected" : "");
    b.textContent = cfg.emoji + " " + (lang === "es" ? cfg.labelEs : cfg.label);
    b.onclick = () => {
      if (selectedTags.includes(key)) selectedTags = selectedTags.filter(t => t !== key);
      else selectedTags.push(key);
      renderTagButtons();
    };
    wrap.appendChild(b);
  });
}

function addBook() {
  const title = document.getElementById("inp-title").value.trim();
  if (!title) return;
  const titleEs = document.getElementById("inp-title-es").value.trim() || title;
  const year    = parseInt(document.getElementById("inp-year").value) || new Date().getFullYear();
  books.push({ id: Date.now(), title, titleEs, year, tags: [...selectedTags] });
  books.sort((a, b) => a.year - b.year);
  document.getElementById("inp-title").value    = "";
  document.getElementById("inp-title-es").value = "";
  document.getElementById("inp-year").value     = "";
  selectedTags = [];
  save(); renderTagButtons(); renderBooks(); updateProgress();
}

function removeBook(id, e) {
  e.stopPropagation();
  books = books.filter(b => b.id !== id);
  delete read[id];
  delete owned[id];
  save(); renderBooks(); updateProgress();
}

// ── TOGGLE READ / OWNED ───────────────────────────────────────────────────────
function toggleRead(id, e) {
  e.stopPropagation();
  read[id] = !read[id];
  save();
  const el = document.querySelector(`.book-item[data-id="${id}"]`);
  if (el) {
    el.classList.toggle("read", !!read[id]);
    el.querySelector(".read-cb").classList.toggle("checked", !!read[id]);
  }
  updateProgress();
}

function toggleOwned(id, e) {
  e.stopPropagation();
  owned[id] = !owned[id];
  save();
  renderBooks();
  updateProgress();
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function updateProgress() {
  const total    = books.length;
  const readCnt  = books.filter(b => read[b.id]).length;
  const ownedCnt = books.filter(b => owned[b.id]).length;
  const pctRead  = total ? Math.round((readCnt  / total) * 100) : 0;
  const pctOwned = total ? Math.round((ownedCnt / total) * 100) : 0;
  document.getElementById("progress-bar").style.width = pctRead + "%";
  document.getElementById("progress-text").textContent =
    `${readCnt} / ${total} ${I18N[lang].read} · ${pctRead}%`;
  document.getElementById("progress-bar-owned").style.width = pctOwned + "%";
  document.getElementById("progress-text-owned").textContent =
    `${ownedCnt} / ${total} ${I18N[lang].owned} · ${pctOwned}%`;
}

// ── RENDER BOOKS ──────────────────────────────────────────────────────────────
function renderBooks() {
  const query = document.getElementById("search").value.toLowerCase();
  const grid  = document.getElementById("book-grid");
  grid.innerHTML = "";

  const filtered = books.filter(b => {
    const matchFilter =
      filter === "all" ||
      (filter === "read"    && read[b.id])   ||
      (filter === "unread"  && !read[b.id])  ||
      (filter === "owned"   && owned[b.id])  ||
      (filter === "missing" && !owned[b.id]) ||
      b.tags.includes(filter);
    const displayTitle = lang === "es" ? (b.titleEs || b.title) : b.title;
    return matchFilter && displayTitle.toLowerCase().includes(query);
  });

  if (filtered.length === 0) {
    const p = document.createElement("p");
    p.style.cssText = "color:#3a3a3a;text-align:center;padding:40px 0";
    p.textContent = I18N[lang].empty;
    grid.appendChild(p);
    return;
  }

  filtered.forEach((book) => {
    const displayTitle = lang === "es" ? (book.titleEs || book.title) : book.title;
    const isRead  = !!read[book.id];
    const isOwned = !!owned[book.id];
    const bookNumber = books.indexOf(book) + 1;

    const div = document.createElement("div");
    div.className = "book-item" + (isRead ? " read" : "");
    div.dataset.id = book.id;

    // read checkbox
    const cbRead = document.createElement("div");
    cbRead.className = "checkbox read-cb" + (isRead ? " checked" : "");
    cbRead.title = lang === "es" ? "Marcar como leído" : "Mark as read";
    cbRead.innerHTML = `<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3.5 6L8 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    cbRead.onclick = (e) => toggleRead(book.id, e);
    div.appendChild(cbRead);

    // owned checkbox
    const cbOwned = document.createElement("div");
    cbOwned.className = "checkbox owned-cb" + (isOwned ? " checked" : "");
    cbOwned.title = lang === "es" ? (isOwned ? "Lo tengo" : "Falta comprarlo") : (isOwned ? "Owned" : "Need to buy");
    cbOwned.innerHTML = `<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5H7.5M4.5 1.5V7.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    cbOwned.onclick = (e) => toggleOwned(book.id, e);
    div.appendChild(cbOwned);

    // text
    const span = document.createElement("span");
    span.className = "book-title";
    let html = `<span class="book-number">#${bookNumber}</span> ${displayTitle} <span class="book-year">(${book.year})</span>`;
    book.tags.forEach(t => {
      if (TAGS[t]) html += `<span class="book-tag" title="${lang==='es'?TAGS[t].labelEs:TAGS[t].label}">${TAGS[t].emoji}</span>`;
    });
    html += isOwned
      ? `<span class="owned-badge" title="${I18N[lang].ownedTitle}">✓ ${I18N[lang].ownedF}</span>`
      : `<span class="missing-badge" title="${I18N[lang].missingTitle}">○ ${I18N[lang].missingF}</span>`;
    html += `<span class="remove-btn" title="${lang==='es'?'Eliminar':'Remove'}" onclick="removeBook(${book.id}, event)">✕</span>`;
    span.innerHTML = html;
    span.onclick = (e) => { if (e.target.classList.contains('remove-btn')) return; toggleRead(book.id, e); };
    div.appendChild(span);
    grid.appendChild(div);
  });
}

// ── LEGEND ────────────────────────────────────────────────────────────────────
function renderLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  Object.entries(TAGS).forEach(([, cfg]) => {
    const s = document.createElement("span");
    s.className = "legend-item";
    s.textContent = cfg.emoji + " " + (lang === "es" ? cfg.labelEs : cfg.label);
    legend.appendChild(s);
  });
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────
function showMsg(text, color) {
  const el = document.getElementById("backup-msg");
  el.textContent = text;
  el.style.color = color;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3000);
}

function exportProgress() {
  const data = {
    version: 2,
    date: new Date().toISOString(),
    read: read,
    owned: owned,
    books: books,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = "stephen-king-progress.json";
  a.click();
  URL.revokeObjectURL(url);
  showMsg(I18N[lang].exportOk, "#7ecf7e");
}

function importProgress(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.read) throw new Error("invalid");
      read  = data.read;
      owned = data.owned || {};
      if (Array.isArray(data.books) && data.books.length) {
        const existingIds = new Set(books.map(b => b.id));
        data.books.forEach(b => { if (!existingIds.has(b.id)) books.push(b); });
        books.sort((a, b) => a.year - b.year);
      }
      save();
      renderBooks();
      updateProgress();
      showMsg(I18N[lang].importOk, "#7eb8cf");
    } catch {
      showMsg(I18N[lang].importErr, "#cf7e7e");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderTagButtons();
applyLang();
renderBooks();
updateProgress();
renderLegend();
</script>
</body>
</html>
